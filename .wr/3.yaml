ac:
  - "ADR data model A publicado en docs/blog-data-model-decision.md (owner confirmed en chat, falta firma formal en issue)."
  - "Migracion SQL: 5 PG functions SECURITY DEFINER con SET search_path = public, pg_temp (defensa contra hijacking). Patron verificado con get_clusters_list."
  - "list_articles(p_tenant_id, p_pillar, p_search, p_tag, p_page, p_page_size) RETURNS TABLE(total bigint, items jsonb). 1 fila, sin duplicacion de total_count. Filtra WHERE tenant_id = p_tenant_id AND published = true AND is_active = true AND draft = false."
  - "get_article_by_slug(p_tenant_id, p_slug) READ-ONLY (sin UPDATE en body). 200 con article+author+tenant+related; 404 si no existe."
  - "increment_article_views(p_tenant_id, p_slug) usa pg_advisory_xact_lock por slug (race-free). Retorna el nuevo views o NULL si no existe."
  - "count_articles_by_pillar(p_tenant_id) RETURNS TABLE(pillar text, count int)."
  - "get_related_articles(p_tenant_id, p_current_article_id, p_tags, p_limit) tag overlap ILIKE."
  - "Tenant warolabs: b2fd8797-ec09-4ba5-aee4-f2d81ef66412. Centralizado en server/utils/blog/tenant.ts (server-only)."
  - "BLOG_PILLARS client-safe en utils/blog/pillars.ts (auto-imported por Nuxt)."
  - "GET /api/blog/index?pillar=&search=&tag=&page= -> {items,total,page,pageSize,pillar,search,tag} via list_articles."
  - "GET /api/blog/[slug] -> 200 cover+autor+tenant+related; 404 si no existe. Slug validado con regex [a-z0-9-]{1,200}."
  - "POST /api/blog/[slug]/view -> {ok, views}. Mutacion separada del GET (REST). Increment race-free via advisory lock."
  - "GET /api/blog/categories -> pillars + counts via count_articles_by_pillar."
  - "pages/blog/{index,[slug]}.vue con useFetch reactivo (Refs + watch en useBlogIndex), CommonsTheLoading, tipos desde useBlog.ts. definePageMeta explicit en ambas."
  - "composables/useBlog.ts con useBlogIndex(Refs), useBlogArticle(Ref), useBlogView, useBlogCategories. ARTICLE, ArticleSummary, ArticleAuthor (de JOIN id_profile), CategoryCount, BLOG_PILLARS (3 slugs reales)."
  - "14 componentes blog/* desde gold warocol, SOLO tokens warolabs + Heroicons. Cero hardcoded colors. Mapear inline SVGs -> Heroicons per CLAUDE.md:264-280."
  - "2 Commons helpers (CommonsTheLoading, MarkdownRenderer) introducidos en review - scope drift documentado en .wr/3.yaml."
  - "Self-contained: NO usa layouts/blog.vue, NO toca BlogSidebar.vue/BlogTOC.vue (limpieza = #4). Backwards compat: pages viejas dan 404 hasta limpieza (out-of-scope #4)."
  - "Blog arranca vacio (0 articulos en warolabs). UI funcional, lista vacia con empty state contextual (por pillar/search). seed-articulos se hace en batch posterior."
  - "Console.error solo loggea error.message (no error completo) - evita leak de schema."
  - "Smoke test 22/22 PASS (estructura + reactive composable + 5 PG funcs + multi-tenant + search_path + BEGIN/COMMIT + increment race-free + slug regex + definePageMeta + scope drift)."
