plan:
  - Rewrite CommonsTheLoading.vue keeping the `label?` prop and adding
    `showPhrase?` (default true) + internal phrase rotation. Render a 6x3
    dot-grid of 1/0 with the same two-keyframe flash pattern (one = accent,
    zero = secondary, dim baseline = text-body/20). Phrase below in
    `text-secondary` with the fade animation. Container uses `text-body` and
    `font-mono` tokens. No hardcoded colors.
  - In `[slug].vue` and `index.vue` the prop usage stays `label="..."`;
    nothing to change unless the layout wrapper needs a `min-h` so the
