# Paths in scope (do not touch anything else)
paths:
  - components/Commons/CommonsTheLoading.vue
  # page files already use CommonsTheLoading; verify they still receive a valid label and the markup
  # supports the new component. No structural changes expected; if a tweak is needed it stays inside
  # the prop contract.
  - pages/blog/[slug].vue
  - pages/blog/index.vue

ac:
  - The dot-grid (1/0) animated loader from front_nuxt's TheCustomLoader is the
    visual reference; warolabs re-implements the same idea inside
    CommonsTheLoading.vue with brand tokens (no crocus/hsl hardcoding).
  - Phrase text rotates every ~3s among 5-6 short es-CO messages (no setTimeout
    for the *loading flag*; the phrase rotation can use setInterval since it is
    decorative, not a fake loading state).
  - Only `useFetch`/composable pending drives the show/hide (per CLAUDE.md).
    No artificial delays, no setTimeout-as-loading.
  - All colors come from tailwind tokens / CSS custom properties already
    defined in tailwind.config.js and assets/css/components.css.
  - Existing call sites keep working: `label?` prop preserved, default behavior
    unchanged for them.
  - No emoji, no inline SVG as functional icon, no hardcoded hex.
  - Manual sanity: `http://localhost:3000/blog/cursor-precio-latam` and
    `/blog` show the new loader; light + dark mode readable.

